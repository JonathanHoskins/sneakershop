<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Sneaker Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>🏀 Nike Sneaker Shop</h1>
                <div id="authSection">
                    <button id="loginBtn" class="btn-auth">Login</button>
                    <button id="registerBtn" class="btn-auth">Register</button>
                    <div id="userSection" style="display: none;">
                        <span id="userEmail"></span>
                        <button id="logoutBtn" class="btn-auth">Logout</button>
                    </div>
                </div>
            </div>
            <nav>
                <button class="nav-btn active" data-filter="all">All Shoes</button>
                <button class="nav-btn" data-filter="available">Available Now</button>
                <button class="nav-btn" data-filter="coming-soon">Coming Soon</button>
                <button class="nav-btn" data-filter="rare">Rare & Affordable</button>
                <button class="nav-btn" data-filter="wishlist">My Wishlist</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="shoes-grid" class="shoes-grid">
            <!-- Shoes will be loaded here dynamically -->
        </div>
    </main>

    <!-- Modal for email notifications -->
    <div id="emailModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Get Notified on Release</h2>
            <p id="modalShoeName"></p>
            <input type="email" id="emailInput" placeholder="Enter your email" required>
            <button id="subscribeBtn" class="btn btn-primary">Subscribe</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-login">&times;</span>
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-register">&times;</span>
            <h2>Register</h2>
            <form id="registerForm">
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Password (min 6 characters)" required minlength="6">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
